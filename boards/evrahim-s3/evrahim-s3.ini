; PlatformIO Project Configuration File
; Evrahim S3 Custom Board
; ESP32-S3 N16R8 + 2.8" ST7789 + XPT2046 + CC1101 + NRF24L01+

[env:evrahim-s3]
board = evrahim-s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/evrahim-s3>
build_flags =
	${env.build_flags}
	-Iboards/evrahim-s3
	-DEVRAHIM_S3=1
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_USB_CDC_ON_BOOT=1

	; TFT on HSPI (SPI3) -- required on ESP32-S3 for correct SPI register pointers
	-DUSE_HSPI_PORT=1

	; XPT2046 touch on separate FSPI bus (pins defined in pins_arduino.h)
	-D TOUCH_XPT2046_SPI
	-D CYD28_TouchR_CAL_XMIN=150
	-D CYD28_TouchR_CAL_XMAX=3850
	-D CYD28_TouchR_CAL_YMIN=150
	-D CYD28_TouchR_CAL_YMAX=3850
	; XPT2046 touch pressure threshold (Z). 300 = lib default, verified on
	; this board. If you get phantom touches at idle, raise in steps
	; (350/400/450); if light touches don't register, lower it (250/200).
	-D CYD28_TouchR_Z_THRESH=300

	; No physical buttons, no mic, no speaker, no RGB LED, no IR
	-DPIN_CLK=-1
	-DI2S_SCLK_PIN=-1
	-DI2S_DATA_PIN=-1
	-DPIN_DATA=-1
	-DRGB_LED=-1
	-DBCLK=-1
	-DWCLK=-1
	-DDOUT=-1

	; No IR hardware -- set disabled pin list to avoid GPIO collision
	-DIR_TX_PINS='{{"Disabled", -1}}'
	-DIR_RX_PINS='{{"Disabled", -1}}'
	-DRF_TX_PINS='{{"CC1101 GDO0", 4}}'
	-DRF_RX_PINS='{{"CC1101 GDO2", 6}}'

	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DDEVICE_NAME='"Evrahim S3"'

lib_deps =
	${env.lib_deps}
