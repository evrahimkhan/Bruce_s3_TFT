# Builds the Evrahim S3 custom board and uploads the flashable firmware.
#
# Push (or open a PR) and download `Bruce-evrahim-s3.bin` from the workflow run's
# artifacts, then flash it with:
#   esptool.py --port /dev/ttyACM0 write_flash 0x00000 Bruce-evrahim-s3.bin

name: Build evrahim-s3

on:
  push:
    paths-ignore:
      - "**.md" # docs-only changes don't need a rebuild
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch: # manual runs from the Actions tab or tools/run_firmware_build.sh always build

permissions:
  contents: write # needed to post the build-log tail as a commit comment on failure

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install 32-bit host GCC (mquickjs header generator)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-evrahim-s3-${{ hashFiles('platformio.ini', 'boards/evrahim-s3/evrahim-s3.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-evrahim-s3-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build evrahim-s3 firmware
        run: pio run -e evrahim-s3 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-evrahim-s3
          path: Bruce-evrahim-s3.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-evrahim-s3-build-log
          path: build.log
          if-no-files-found: warn

      - name: Report failure (build log tail)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "❌ **evrahim-s3 build failed** (run ${{ github.run_id }}) — last 60 lines of \`pio run -e evrahim-s3\`:"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } > /tmp/fail.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat /tmp/fail.md)"
